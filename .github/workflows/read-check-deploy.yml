# The stop on the server (Open Brain 5461, 24 Nov 2026; since dispatch 5493 the same day it checks the writer's step
# record, decode method version 9, Open Brain 5492). Every push to any branch, from any machine, a cloud session or the
# GitHub web editor, runs readcheck.py of the Demismatch workspace on every page of this repo: a sentence that is in
# neither the baseline of 24 Nov nor part 6 of its page's record (whatreally/ledgers/<page>/record.json) stops the
# deploy, and so does a page that prints method version 9 or higher without its whole record (workspace
# whatreally/README.md, "The step record and the stop"). The site deploys to GitHub Pages only from main and only after
# the check passed. A failed check, a missing key or an unreachable workspace means no deploy; the live site stays as
# it was.
#
# The records, the baseline, the Cor index and the method file live in the private workspace repo. This job reads them with a read-only deploy key of that repo,
# stored here as the secret WORKSPACE_READ_KEY. It checks every page, not only the pages a push changed: otherwise a
# later harmless push would deploy a page an earlier push changed and the check stopped.
#
# SWITCHED OFF on 24 Nov 2026 (Maarten): the second AI read of page text is dropped. readcheck.py in the workspace has
# ENFORCED = False, so the check step below passes without checking anything. This file still does the deploy.
name: Read check, then deploy
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: read-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-check:
    runs-on: ubuntu-latest
    steps:
      - name: The workspace key is set (no key, no check, no deploy)
        env:
          K: ${{ secrets.WORKSPACE_READ_KEY }}
        run: |
          if [ -z "$K" ]; then echo "::error::Secret WORKSPACE_READ_KEY is missing: the read records cannot be read, so nothing deploys."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: MaartenRischen/demismatch-workspace
          ssh-key: ${{ secrets.WORKSPACE_READ_KEY }}
          path: ws
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            whatreally/builders/readcheck.py
            whatreally/ledgers/
            cor-needs/no-record-reads.md
            claude-web/project-docs/claude/decode-method.md
      - name: Step record check, every page
        run: |
          echo "site ${GITHUB_SHA::7}, workspace $(git -C ws rev-parse --short HEAD)"
          python3 ws/whatreally/builders/readcheck.py check-site site
          echo "step record check passed: every sentence on every page is in the baseline of 24 Nov 2026 or in its page's record"
  deploy:
    needs: read-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub lists a fresh artifact a few seconds after the upload reports success. On 24 Nov 2026 three runs in a row
      # failed here with "No artifacts named github-pages were found" because the deploy asked within half a second.
      - name: Wait for GitHub to list the uploaded site
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
