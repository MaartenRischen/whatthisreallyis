<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What this really is</title><link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="What this really is">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>:root{--oxblood:#3a1218;--parchment:#ece0c4;--teal:#2d6b6b;--serif:"Spectral",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
html,body{margin:0;background:var(--parchment);color:var(--oxblood)}
body{overflow-x:hidden}
header{padding:32px 16px 8px;max-width:1360px;margin:0 auto}
h1{font:italic 500 clamp(30px,4vw,52px)/1.08 var(--serif);margin:0 0 10px}
header p{font:400 clamp(17px,1.6vw,21px)/1.4 var(--serif);margin:0;max-width:62ch}
ul{list-style:none;margin:24px auto 0;padding:0 16px 60px;max-width:1360px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),390px));justify-content:center;gap:48px 32px}
ul>li{min-width:0;border-top:1px solid var(--oxblood);padding-top:20px}
img{display:block;width:100%;height:auto}
.src{background:#fff;color:#1d1d1d;border:1px solid var(--oxblood);border-radius:3px;padding:12px 12px 10px;box-shadow:0 2px 0 rgba(58,18,24,.15)}
.from{font:600 12px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#666;margin:0 0 10px}
.shot img{border:1px solid #ddd}
.link{font:400 13px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#555;margin:10px 0 0;padding-top:8px;border-top:1px solid #e3e3e3}.link a{color:#1a4d8f}
.quotes{margin:12px 0 0}
blockquote{font:400 15px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#1d1d1d;margin:0 0 10px;padding:0 0 0 12px;border-left:3px solid #c8c8c8}

.pair{margin-top:22px;display:grid;gap:3px}
.say{margin:12px 0 0}.say+.say{margin-top:16px}
h3{font:500 13px/1.3 var(--mono);color:var(--teal);text-transform:uppercase;letter-spacing:0.06em;margin:0 0 4px}
.say p{font:400 17px/1.4 var(--serif);margin:0}
.cor{margin:28px 0 0;padding:16px 0 0;border-top:2px solid var(--oxblood)}
.cor>h3{margin-bottom:6px}.lede{font:400 15px/1.4 var(--serif);margin:0}
.mech{margin:22px 0 0;padding:0}
figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.code{font:500 13px/1 var(--mono);color:#fff;background:var(--oxblood);padding:4px 6px 3px;border-radius:2px;text-decoration:none}
.nm{font:500 18px/1.25 var(--serif)}
.meta{flex-basis:100%;font:400 12px/1.4 var(--mono);color:var(--teal);margin-top:4px}
.needs{font:400 15px/1.4 var(--serif);margin:6px 0 10px}.needs .k{display:block;font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:2px}
.grad{list-style:none;margin:0;padding:0;border-top:1px solid rgba(58,18,24,.35)}
.rw{display:grid;grid-template-columns:76px 1fr auto;gap:0 10px;align-items:baseline;padding:7px 0 7px 10px;border-bottom:1px solid rgba(58,18,24,.18);position:relative}
.rw::before{content:"";position:absolute;left:0;top:0;bottom:-1px;width:4px;background:var(--teal)}
.r0::before{opacity:1}.r1::before{opacity:.75}.r2::before{opacity:.5}.r3::before{opacity:.3}.r4::before{opacity:.12}.r5::before{background:none;border-left:2px dashed rgba(58,18,24,.5);width:0}
.r5{border-top:1px dashed rgba(58,18,24,.4)}
.lv{font:500 10.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:rgba(58,18,24,.6)}
.lb{font:400 14px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#2a1a1c}
.ev{font:400 10.5px/1.3 var(--mono);color:var(--teal);text-align:right}
.tx{display:flex;flex-direction:column;gap:3px}
.nt{font:500 12.5px/1.35 var(--mono)}.nt.then{color:#8a6414}.nt.now{color:#B3261C}
.is-now{background:rgba(179,38,28,.07)}.is-now .lb{font-weight:600}.is-now .lv{color:#B3261C}
.con{font:italic 400 13.5px/1.4 var(--serif);color:rgba(58,18,24,.8);margin:8px 0 0}
.cnote{font:italic 400 15px/1.4 var(--serif);margin:16px 0 0}
.nowwhat{margin:28px 0 0;padding:16px 0 0;border-top:2px solid var(--oxblood)}
.nowwhat ol{list-style:none;counter-reset:a;margin:8px 0 0;padding:0}
.nowwhat li{counter-increment:a;position:relative;padding:10px 0 10px 34px;border-bottom:1px solid rgba(58,18,24,.18);font:400 16px/1.4 var(--serif)}
.nowwhat li::before{content:counter(a);position:absolute;left:0;top:10px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font:500 12px/22px var(--mono);text-align:center}
.nowwhat b{display:block;font:600 15px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;margin-bottom:2px}
.foot{font:400 13px/1.5 var(--mono);color:var(--teal);padding:0 16px 40px;max-width:1360px;margin:0 auto}

/* Shared by every door: the bar that links the doors, the real-post tiles and the then-now films.
   Each door sets --d-ink, --d-dim, --d-line and --d-accent in its own colours. */
.doors { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 11px 16px 10px; margin: 0; color: var(--d-ink);
  border-bottom: 1px solid var(--d-line); font: 500 14px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; }
.doors .dm { font-weight: 700; margin-right: auto; }
.doors a { color: var(--d-dim); text-decoration: none; }
.doors a:hover { color: var(--d-ink); }
.doors a[aria-current] { color: var(--d-ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

.tiles { display: grid; gap: 16px; }
.tile { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-content: start; gap: 2px 12px; color: var(--d-ink); text-decoration: none; }
.tile img { grid-row: 1 / span 4; width: 112px; height: auto; aspect-ratio: 1000 / 590; object-fit: cover; display: block; }
.tile .hl { font: 600 15px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; }
.tile .wh { font: 400 12.5px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--d-dim); }
.tile .bs { font: 500 12.5px/1.35 "JetBrains Mono", ui-monospace, Menlo, monospace; color: var(--d-accent); }
.tile .url { font: 400 11.5px/1.4 "JetBrains Mono", ui-monospace, Menlo, monospace; color: var(--d-dim); overflow-wrap: anywhere; }
.tile:hover .hl { text-decoration: underline; }
.tiles.big { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 32px 28px; }
.tiles.big .tile { grid-template-columns: minmax(0, 1fr); gap: 4px; }
.tiles.big .tile img { grid-row: auto; width: 100%; margin-bottom: 8px; }

.film { position: relative; aspect-ratio: 16 / 9; background: #14110f; overflow: hidden; }
.film video, .film canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.film.now { box-shadow: inset 0 0 0 2px #E0201A; }
.film.now canvas { z-index: 1; }

:root{--d-ink:#3a1218;--d-dim:rgba(58,18,24,.62);--d-line:rgba(58,18,24,.22);--d-accent:#2d6b6b}
body.case header,body.cases header{max-width:1360px}body.case header{max-width:390px}
header .brand{font:italic 500 26px/1.1 var(--serif);margin:0 0 8px}header .brand a{color:inherit;text-decoration:none}
body.case header p:not(.brand){font-size:16px}
.after{max-width:390px;margin:0 auto;padding:0 16px 24px}
.after section{margin:0 0 36px;padding:16px 0 0;border-top:2px solid var(--oxblood)}
.after h3{margin-bottom:10px}
.fl{font:500 19px/1.25 var(--serif);margin:8px 0 14px}.fl.now{margin-bottom:10px}
.go{font:400 15px/1.45 var(--serif);margin:0}.go a{color:var(--oxblood);font-weight:600}
.url{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font:500 14px/1.4 var(--mono);margin:0;overflow-wrap:anywhere}
.url button{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--teal);border:0;border-radius:2px;padding:7px 10px;cursor:pointer}
.all{font:400 15px/1.5 var(--serif);margin:16px 0 0}.all a{color:var(--oxblood);font-weight:600}
body.cases .tiles{max-width:1360px;margin:24px auto 0;padding:0 16px 48px;box-sizing:border-box}</style>
</head>
