<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Online soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f1ea; --ink: #16140f; --dim: #6b665c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121110; --ink: #f1ede4; --dim: #9a948a; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Schibsted Grotesk", system-ui, sans-serif;
         display: grid; place-items: center; padding: 0 16px; }
  main { max-width: 34rem; }
  h1 { font-size: clamp(2.4rem, 9vw, 4.5rem); line-height: 1; margin: 0 0 .4em; font-weight: 700; letter-spacing: -.02em; }
  p { font-size: 1.15rem; line-height: 1.5; margin: 0; color: var(--dim); font-weight: 500; }
</style>
</head>
<body>
<main>
  <h1>Online soon.</h1>
  <p>This site is being built. It is not open yet.</p>
</main>
</body>
</html>
